name: Deploy docs

# Publishes the static docs-site to GitHub Pages.
#
# The site is a plain Astro/Starlight static build. On push to main (when
# docs-site/ changes), it builds and deploys to GitHub Pages automatically.

on:
  push:
    branches: [main]
    paths: ['docs-site/**', 'self-host/get.sh']
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      - name: Copy get.sh into dist
        run: cp self-host/get.sh docs-site/dist/get.sh

      - uses: actions/upload-pages-artifact@56afc609e74202f3d2f71f0f2f95c19e1e7671ce # v3
        with:
          path: docs-site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
