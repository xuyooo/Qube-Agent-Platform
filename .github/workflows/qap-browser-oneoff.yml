name: One-off qap-browser GHCR verification

on:
  push:
    branches:
      - codex/qap-browser-ghcr-verify-20261127

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: browser-service/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/xuyooo/qap/qap-browser,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=qap-browser-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=qap-browser-${{ matrix.platform.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-qap-browser-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-qap-browser-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        env:
          IMAGE: ghcr.io/xuyooo/qap/qap-browser
        run: |
          cd /tmp/digests
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA::12}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect published image
        env:
          IMAGE: ghcr.io/xuyooo/qap/qap-browser
        run: docker buildx imagetools inspect "$IMAGE:latest"

      - name: Verify anonymous pull
        id: anonymous
        continue-on-error: true
        env:
          IMAGE: ghcr.io/xuyooo/qap/qap-browser
        run: |
          docker logout ghcr.io || true
          docker buildx imagetools inspect "$IMAGE:latest"

      - name: Record anonymous pull result
        if: always()
        run: echo "Anonymous GHCR pull check: ${{ steps.anonymous.outcome }}" >> "$GITHUB_STEP_SUMMARY"
